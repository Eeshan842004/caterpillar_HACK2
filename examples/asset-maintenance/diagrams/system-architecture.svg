<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8; }
      .box-focus { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .box-danger { fill: #1e293b; stroke: #ef4444; stroke-width: 2; rx: 8; }
      .box-success { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 8; }
      .title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 12px; }
      .header-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 22px; font-weight: bold; }
      .header-sub { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-dashed { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .badge { fill: #38bdf8; font-family: monospace; font-size: 10px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" class="bg" />

  <!-- Title & Subtitle -->
  <text x="40" y="45" class="header-title">Equipment Operations Workspace — Modular System Architecture</text>
  <text x="40" y="68" class="header-sub">Modular Industrial Spine (Council SHA: c00bdca0 | ADR-0001 through ADR-0005)</text>

  <!-- Layer 1: Ingestion & Telematics -->
  <rect x="40" y="110" width="240" height="180" class="box" />
  <text x="60" y="140" class="title">1. Data Ingestion</text>
  <text x="60" y="165" class="subtitle">• ISO 15143-3 Telematics Stream</text>
  <text x="60" y="185" class="subtitle">• J1939 Diagnostic DTCs (SPN/FMI)</text>
  <text x="60" y="205" class="subtitle">• Dual Timestamps (Observed/Ingested)</text>
  <text x="60" y="235" class="subtitle">• Quality Filter (GOOD/STALE/OOR)</text>
  <text x="60" y="260" class="subtitle">• Raw Payload Lineage Retention</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 280 200 L 350 200" class="arrow" />

  <!-- Layer 2: Recommendation Engine -->
  <rect x="360" y="110" width="240" height="180" class="box-focus" />
  <text x="380" y="140" class="title">2. Recommendation Engine</text>
  <text x="380" y="165" class="subtitle">• Deterministic Rule Evaluator</text>
  <text x="380" y="185" class="subtitle">• Thermal Trajectory Correlation</text>
  <text x="380" y="205" class="subtitle">• Sensor Evidence Citation Bundling</text>
  <text x="380" y="235" class="subtitle">• Diagnostic Confidence (0 - 100%)</text>
  <text x="380" y="260" class="subtitle">• Stale Sensor Graceful Degradation</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 600 200 L 670 200" class="arrow" />

  <!-- Layer 3: Safety Compliance Gate -->
  <rect x="680" y="110" width="240" height="180" class="box-danger" />
  <text x="700" y="140" class="title">3. Safety Gate (ADR-0003)</text>
  <text x="700" y="165" class="subtitle">• Strictly Advisory (No Actuation)</text>
  <text x="700" y="185" class="subtitle">• Mandatory Human Confirmation</text>
  <text x="700" y="205" class="subtitle">• Approver Persona Verification</text>
  <text x="700" y="235" class="subtitle">• Technician & Parts Assignment</text>
  <text x="700" y="260" class="subtitle">• Rejection of Unsigned Actions</text>

  <!-- Arrow 3 down to Layer 4 -->
  <path d="M 800 290 L 800 340 L 600 340" class="arrow" />

  <!-- Layer 4: Operational Workspace UI -->
  <rect x="360" y="320" width="240" height="180" class="box-focus" />
  <text x="380" y="350" class="title">4. Operational Workspace</text>
  <text x="380" y="375" class="subtitle">• Next.js 14 App Router UI</text>
  <text x="380" y="395" class="subtitle">• Interactive Recharts Trajectory</text>
  <text x="380" y="415" class="subtitle">• Fleet Overview & Status Badges</text>
  <text x="380" y="445" class="subtitle">• Offline Resilient Queueing Banner</text>
  <text x="380" y="470" class="subtitle">• 150ms Instant Ground-Truth Reset</text>

  <!-- Layer 5: Storage & Audit Port -->
  <rect x="40" y="320" width="240" height="180" class="box-success" />
  <text x="60" y="350" class="title">5. Persistence & Audit</text>
  <text x="60" y="375" class="subtitle">• Storage-Neutral Repository Ports</text>
  <text x="60" y="395" class="subtitle">• Deterministic In-Memory Baseline</text>
  <text x="60" y="415" class="subtitle">• Idempotent Sync Replay Protection</text>
  <text x="60" y="445" class="subtitle">• SHA-256 Tamper-Evident Audit</text>
  <text x="60" y="470" class="subtitle">• Zero External Cloud Dependency</text>

  <!-- Arrow between 4 and 5 -->
  <path d="M 360 410 L 280 410" class="arrow" />
</svg>
