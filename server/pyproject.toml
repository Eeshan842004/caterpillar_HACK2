[project]
name = "shiftmate-server"
version = "1.0.0"
description = "ShiftMate site server and ML pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "httpx2==2.13.1",  # Starlette TestClient transport (tests only)
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live_ai'"  # live AI calls cost money: run them only with `pytest -m live_ai`
pythonpath = ["."]
markers = [
    "live_ai: marks tests as requiring external AI APIs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shiftmate*", "shiftmate_ml*"]
exclude = ["var*", "tests*"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated per request, not shared mutable defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.params.Depends", "fastapi.params.Query",
    "shiftmate.security.console_auth.require_role",
]
