schema_version: "1.2.0"
generator_version: "gen-1.0"
seed: 20260923
anchor_date: "2026-09-22"
data_origin: "synthetic:gen-1.0:20260923"

num_weeks: 12
working_days_per_week: 6

split_policy:
  temporal:
    train_weeks: [1, 8]
    calibration_weeks: [9, 10]
    test_weeks: [11, 12]
  unseen_operator:
    held_out_excavators:
      - "OP-0001"
      - "OP-0004"
      - "OP-0010"
      - "OP-0013"
    held_out_haul_trucks:
      - "OP-0022"
      - "OP-0025"
      - "OP-0028"
      - "OP-0033"

effects:
  skill:
    beginner: 0.30
    intermediate: 0.00
    expert: -0.05
    rationale: "Beginners spend more time positioning and cycling (+30%); experts have refined control and cycle rhythm (-5%)."
  
  experience:
    coef: -0.06
    anchor_log_months: 3.0
    plateau_months: 36
    rationale: "Learning curve -0.06 * (log1p(min(months, 36)) - 3.0): fast early gains that stop after about three years. The plateau is deliberately NOT the estimator's plain log1p transform, so a linear model cannot fit it exactly."

  weather:
    clear: 0.00
    rain: 0.14
    windy: 0.10
    windy_sensitive_extra: 0.20
    dusty: 0.07
    foggy: 0.09
    rationale: "Adverse weather impairs traction and soil handling. Wind adds +20% extra to wind-sensitive tasks like pipe lifting."

  visibility:
    good: 0.00
    moderate: 0.04
    poor: 0.10
    rationale: "Reduced visibility slows down haul speeds and swinging operations due to cautious maneuvering."

  temperature_band:
    cool: 0.00
    mild: 0.00
    hot: 0.03
    extreme: 0.08
    rationale: "Extreme ambient heat (>38C) places stress on cooling systems and causes operators to pace work more conservatively."

  time_of_day:
    morning: 0.00
    afternoon: 0.00
    evening: 0.03
    night: 0.06
    rationale: "Night operations suffer from directional shadow glare and circadian fatigue, adding ~6% to cycle duration."

  congestion:
    low: 0.00
    medium: 0.04
    high: 0.11
    rationale: "Congested worksites introduce queueing at crossings, loading pockets, and dump ramps (+11% high congestion)."

  machine_age:
    coef_per_year: 0.012
    rationale: "Wear in linkages, minor hydraulic throttling, and aging components degrade cycle efficiency by 1.2% per year of age."

  material:
    clay: 0.00
    sand: 0.00
    gravel: 0.00
    topsoil: 0.00
    rock: 0.05
    overburden: 0.00
    ore: 0.05
    rationale: "Hard rock and abrasive ore resist penetration and require higher breakout effort (+5%)."

  interactions:
    rain_clay_trenching: 0.10
    beginner_night: 0.12
    beginner_rain: 0.08
    high_congestion_haul: 0.06
    rationale: "Effects that only appear together (wet clay trench walls, a new operator at night or in rain, queueing trucks on a congested pit). A main-effects Ridge model cannot represent them exactly, which keeps the evaluation from being circular (product §19) and gives the LightGBM comparison (S7) something real to find."

  operator_variance:
    sigma: 0.06
    rationale: "Persistent individual operator style and pacing differences modeled as N(0, 0.06)."

  site_variance:
    sigma: 0.04
    rationale: "Site-specific layout, gradient, and haul road maintenance factors modeled as N(0, 0.04)."

  noise_variance:
    sigma: 0.10
    small_task_extra_sigma: 0.10
    small_task_scale_min: 40
    disruption_prob: 0.03
    disruption_min: 0.25
    disruption_max: 0.60
    rationale: "Heteroscedastic, heavy-tailed noise: sigma = 0.10 + 0.10 * exp(-baseline/40), so short tasks vary more in relative terms, plus a 3% chance of an unmodelled disruption adding +0.25..0.60 (log). Constant Gaussian noise would make conformal P10-P90 ranges look perfectly calibrated by construction."

calibration:
  log_intercept_by_class:
    excavator: -0.20
    haul_truck: -0.38
  rationale: "Profile rates are rated (best-case) values, and the summed condition, skill and congestion effects push the synthetic mean far above the organiser evidence (planner MAPE 13.2%, planner under-estimates on average; product §2.2). A per-class constant log offset re-centres mean actual/baseline to about 1.05 without changing any effect size or the relative ranking of conditions. It is a calibration, not a finding."

planner:
  scale: 0.92
  sigma: 0.08
  rationale: "Dispatch planners systematically plan ~8% faster than actuals by ignoring weather and congestion variations."

waits:
  lambda_by_task_type:
    trenching: 0.3
    truck_loading: 0.8
    backfilling: 0.4
    grading: 0.3
    pipe_lifting: 0.5
    haul_overburden: 1.2
    haul_ore: 1.2
  congestion_multiplier:
    low: 0.7
    medium: 1.0
    high: 1.5
  rain_multiplier: 1.3
  duration_lognormal_median_min: 9.0
  duration_lognormal_sigma: 0.5
  reported_prob: 0.85
  unexplained_prob: 0.15
  habitual_unexplained_operator_count: 6
  reason_weights:
    truck_loading: {waiting_truck: 0.55, access_blocked: 0.10, instructed_hold: 0.10, break: 0.15, other: 0.10}
    trenching: {waiting_truck: 0.15, access_blocked: 0.30, instructed_hold: 0.25, break: 0.20, other: 0.10}
    backfilling: {waiting_truck: 0.40, access_blocked: 0.15, instructed_hold: 0.15, break: 0.20, other: 0.10}
    grading: {waiting_truck: 0.10, access_blocked: 0.30, instructed_hold: 0.30, break: 0.20, other: 0.10}
    pipe_lifting: {waiting_loader: 0.20, access_blocked: 0.20, instructed_hold: 0.35, break: 0.15, other: 0.10}
    haul: {shovel_queue: 0.40, crusher_queue: 0.30, access_blocked: 0.08, instructed_hold: 0.07, break: 0.10, other: 0.05}
  correction_prob: 0.06
  rationale: "Queues follow Poisson arrivals scaled by site congestion (x0.7 / x1.0 / x1.5) and rain (x1.3), with lognormal durations (median 9 min). 85% are reported. Reasons depend on the task: truck loading mostly waits for trucks; haul trucks queue at the shovel and crusher. 6% of reported reasons are later corrected by the operator (explain-once history)."

required_idle:
  cooldown_prob: 0.35
  cooldown_load_pct: 60
  cooldown_s: 300
  warmup_prob: 0.25
  warmup_s: 420
  rationale: "Cool-down after heavy loading (avg load >= 60% in the task) and cold-start warm-up at shift start are required idle (§8.7): no prompt, no follow-up, never operator waste."

task_events:
  pause_prob: 0.10
  pause_min: [3, 12]
  block_prob: 0.03
  block_min: [8, 30]
  cancel_prob: 0.015
  rationale: "Some tasks are paused (another instruction), blocked (access, weather, utility mark: counts as waiting, §8.6.7) or cancelled by the supervisor before starting (not training eligible)."

sensors:
  dropout_prob: 0.03
  dropout_signals: [fuel_used_l, seatbelt_fastened, ground_speed_kmh, load_factor_pct]
  dropout_seconds: [10, 120]
  rationale: "Sensor dropouts null the affected metric and, for state-critical signals (speed, load factor), put the missing seconds into unknown_s — never zero or false (principle 5)."

sensitivity:
  scales: [0.5, 1.5]
  rationale: "Sensitivity benchmarks at 0.5x and 1.5x effect scaling test estimator resilience against mild and extreme operational frictions."
